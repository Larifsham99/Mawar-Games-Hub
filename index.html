<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hab Permainan Edukasi Islami</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#059669">
    <link rel="apple-touch-icon" href="./178441.png">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('ServiceWorker berjaya didaftarkan:', registration.scope);
            })
            .catch(error => {
              console.log('Pendaftaran ServiceWorker gagal:', error);
            });
        });
      }
    </script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #047857 0%, #10b981 50%, #f59e0b 100%);
            background-attachment: fixed;
            min-height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom);
            padding-top: env(safe-area-inset-top);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; 
        }
        .font-arabic { font-family: 'Amiri', serif; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* --- Cari Kata Styles --- */
        .grid-container {
            display: grid; gap: 4px; padding: 6px; border-radius: 16px;
            background: rgba(255, 255, 255, 0.6); box-shadow: inset 0 4px 6px rgba(0,0,0,0.1);
            margin: 0 auto; width: 100%; max-width: 85vmin; aspect-ratio: 1 / 1; touch-action: none; 
        }
        .cell {
            background-color: #ffffff; display: flex; align-items: center; justify-content: center;
            font-size: clamp(1rem, 4vmin, 1.5rem); font-weight: 700; color: #064e3b;
            border-radius: 8px; cursor: pointer; box-shadow: 0 3px 0 #e5e7eb;
            transition: transform 0.05s ease, background-color 0.1s ease;
        }
        .cell.highlighted { background-color: #fcd34d; color: #78350f; box-shadow: 0 2px 0 #d97706; transform: scale(0.95); }
        .cell.found { background-color: #10b981; color: white; box-shadow: 0 3px 0 #059669; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes pulse-glow {
            0%, 100% { background-color: #fef08a; box-shadow: 0 0 15px #facc15, 0 3px 0 #ca8a04; color: #b45309; transform: scale(1); border: 2px solid #fbbf24;}
            50% { background-color: #fde047; box-shadow: 0 0 25px #eab308, 0 3px 0 #a16207; color: #78350f; transform: scale(1.08); border: 2px solid #f59e0b;}
        }
        .cell.missed-glow { animation: pulse-glow 1.5s infinite ease-in-out; z-index: 5; position: relative; }
        
        .word-item { transition: all 0.3s ease; }
        .word-item.found { background-color: #a7f3d0; color: #065f46; text-decoration: line-through; opacity: 0.7; transform: scale(0.95); }
        .word-item.missed { background-color: #fef3c7; color: #b45309; border-color: #f59e0b; animation: shake 0.5s ease-in-out; }

        /* --- Custom Dropdown Styles --- */
        #customSelectOptions { max-height: 250px; overflow-y: auto; z-index: 1000; }
        .custom-dropdown-open { animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .custom-option { transition: transform 0.15s ease, background-color 0.15s ease; }
        .custom-option:active { transform: scale(0.98); }

        /* --- Uji Mata Al-Quran & Tajwid Styles --- */
        .quran-target-card { background: linear-gradient(135deg, #ffffff 0%, #fef3c7 100%); border: 4px solid #f59e0b; box-shadow: 0 8px 20px rgba(0,0,0,0.15), inset 0 0 15px rgba(245,158,11,0.1); }
        .quran-btn { background-color: #ffffff; color: #064e3b; box-shadow: 0 5px 0 #cbd5e1; transition: transform 0.1s, box-shadow 0.1s; }
        .quran-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #cbd5e1; }
        .quran-btn.correct { background-color: #10b981; color: white; box-shadow: 0 5px 0 #059669; animation: popIn 0.3s; }
        .quran-btn.wrong { background-color: #ef4444; color: white; box-shadow: 0 5px 0 #b91c1c; animation: shake 0.4s ease-in-out; }
        .tajwid-highlight { color: #f59e0b; text-decoration: underline; text-decoration-color: #f59e0b; text-decoration-thickness: 4px; font-weight: bold; }

        /* --- Global Animations & Overlays --- */
        #overlay, #leaderboardOverlay { background: rgba(2, 44, 34, 0.85); backdrop-filter: blur(8px); }
        .praise-popup { position: absolute; font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; color: #fcd34d; text-shadow: 0px 4px 0px #b45309, 0 8px 20px rgba(0,0,0,0.4); pointer-events: none; z-index: 1000; animation: floatUpAndFade 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; white-space: nowrap; }
        
        @keyframes floatUpAndFade { 0% { opacity: 0; transform: translate(-50%, 20px) scale(0.5) rotate(-5deg); } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.1) rotate(2deg); } 80% { opacity: 1; transform: translate(-50%, -50px) scale(1) rotate(0deg); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(0.9); } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(-3%); } 50% { transform: translateY(3%); } }
        .animate-bounce-slow { animation: bounce-slow 3s infinite ease-in-out; }
        @keyframes bounceIn { 0% { transform: scale(0.8) translateY(20px); opacity: 0; } 60% { transform: scale(1.02) translateY(-5px); opacity: 1; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .animate-bounceIn { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes star-pop { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 70% { transform: scale(1.3) rotate(15deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        
        .star-icon { opacity: 0; font-size: 3.5rem; display: inline-block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
        .star-icon.animate-pop { animation: star-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; } 
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; } 
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        
        /* Baby Character Animations */
        @keyframes peekFloat { 0% { transform: translateY(100%); opacity: 0; } 30% { transform: translateY(15%); opacity: 1; } 50% { transform: translateY(20%); opacity: 1; } 70% { transform: translateY(12%); opacity: 1; } 100% { transform: translateY(15%); opacity: 1; } }
        .animate-peek-float { animation: peekFloat 4s ease-out forwards; }
        .animate-peek-float-delay-1 { animation: peekFloat 4s ease-out 0.4s forwards; transform: translateY(100%); opacity: 0; }
        .animate-peek-float-delay-2 { animation: peekFloat 4s ease-out 0.8s forwards; transform: translateY(100%); opacity: 0; }
        @keyframes bounceHappy { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } }
        .animate-bounce-happy { animation: bounceHappy 0.6s infinite ease-in-out; }
    </style>
</head>
<body class="flex flex-col items-center justify-center text-gray-800">

        // Audio System
        let audioUnlocked = false;
        function unlockAudio() {
            if (audioUnlocked) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if ('speechSynthesis' in window) { const initUtterance = new SpeechSynthesisUtterance(""); initUtterance.volume = 0; window.speechSynthesis.speak(initUtterance); }
            try { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); gain.gain.value = 0; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(0); osc.stop(audioCtx.currentTime + 0.001); } catch(e) {}
            audioUnlocked = true; document.removeEventListener('click', unlockAudio); document.removeEventListener('touchstart', unlockAudio);
        }
        document.addEventListener('click', unlockAudio, { passive: true }); document.addEventListener('touchstart', unlockAudio, { passive: true });
        
        function playTone(type, freqStart, freqEnd, duration, volStart) {
            if (!audioUnlocked) unlockAudio(); if (!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = type;
            osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
            if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(volStart, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        
        function playCuteClick() { playTone('sine', 600, 1200, 0.1, 0.4); }

        function playErrorBuzz() {

        function switchLbTab(tab) {
            currentLeaderboardTab = tab; [tabCariKata, tabUjiMata, tabTajwid].forEach(t => t.classList.replace('bg-teal-500', 'bg-gray-200')); [tabCariKata, tabUjiMata, tabTajwid].forEach(t => t.classList.replace('text-white', 'text-gray-600'));
            const activeTab = tab === 'carikata' ? tabCariKata : (tab === 'ujimata' ? tabUjiMata : tabTajwid); activeTab.classList.replace('bg-gray-200', 'bg-teal-500'); activeTab.classList.replace('text-gray-600', 'text-white'); fetchLeaderboard(tab);
        }
        
        tabCariKata.addEventListener('click', () => { playPop(); switchLbTab('carikata'); }); tabUjiMata.addEventListener('click', () => { playPop(); switchLbTab('ujimata'); }); tabTajwid.addEventListener('click', () => { playPop(); switchLbTab('tajwid'); });
        showLeaderboardBtns.forEach(btn => { btn.addEventListener('click', () => { playPop(); leaderboardOverlay.classList.remove('hidden'); switchLbTab(selectedGameMode || 'carikata'); }); });
        closeLeaderboardBtn.addEventListener('click', () => { playPop(); leaderboardOverlay.classList.add('hidden'); });
    </script>
</body>
</html>
